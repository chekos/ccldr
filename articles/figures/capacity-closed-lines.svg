<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Example line chart of closed capacity by city and year</title>
  <desc id="desc">Small multiple line chart showing recorded capacity on closed facilities by year for four cities.</desc>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222222">Closed capacity records by city and year</text>
  <text x="58" y="68" font-family="Arial, sans-serif" font-size="14" fill="#555555">Recorded capacity on closed facilities, representative output</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#333333">
    <text x="82" y="105">Oakland</text>
    <text x="410" y="105">Fremont</text>
    <text x="82" y="255">Hayward</text>
    <text x="410" y="255">Berkeley</text>
  </g>
  <g stroke="#d8d8d8">
    <rect x="82" y="118" width="270" height="105" fill="none"/>
    <rect x="410" y="118" width="270" height="105" fill="none"/>
    <rect x="82" y="268" width="270" height="105" fill="none"/>
    <rect x="410" y="268" width="270" height="105" fill="none"/>
  </g>
  <g fill="none" stroke="#636363" stroke-width="2">
    <polyline points="96,198 156,176 216,184 276,142 336,158"/>
    <polyline points="424,205 484,190 544,166 604,182 664,150"/>
    <polyline points="96,350 156,330 216,340 276,302 336,318"/>
    <polyline points="424,352 484,344 544,320 604,336 664,306"/>
  </g>
  <g fill="#de2d26">
    <circle cx="96" cy="198" r="4"/><circle cx="156" cy="176" r="4"/><circle cx="216" cy="184" r="4"/><circle cx="276" cy="142" r="4"/><circle cx="336" cy="158" r="4"/>
    <circle cx="424" cy="205" r="4"/><circle cx="484" cy="190" r="4"/><circle cx="544" cy="166" r="4"/><circle cx="604" cy="182" r="4"/><circle cx="664" cy="150" r="4"/>
    <circle cx="96" cy="350" r="4"/><circle cx="156" cy="330" r="4"/><circle cx="216" cy="340" r="4"/><circle cx="276" cy="302" r="4"/><circle cx="336" cy="318" r="4"/>
    <circle cx="424" cy="352" r="4"/><circle cx="484" cy="344" r="4"/><circle cx="544" cy="320" r="4"/><circle cx="604" cy="336" r="4"/><circle cx="664" cy="306" r="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#555555">
    <text x="88" y="396">2022</text>
    <text x="324" y="396">2026</text>
    <text x="416" y="396">2022</text>
    <text x="652" y="396">2026</text>
  </g>
</svg>
